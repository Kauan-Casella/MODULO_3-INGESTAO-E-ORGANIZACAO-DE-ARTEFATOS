services:
  api:
    build: .
    container_name: artifact-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://artifact_user:${POSTGRES_PASSWORD}@host.docker.internal:5432/artifact_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
